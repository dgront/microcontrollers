[package]
name = "synth"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
portaudio = "0.8"

[[bin]]
name = "synth"
path = "src/synth.rs"

